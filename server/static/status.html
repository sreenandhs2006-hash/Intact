<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Status</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  .name { font-weight:600; color:var(--strong); word-break:break-all; }
  .hashes { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; align-items:center; margin-top:10px; }
  .empty { color:var(--muted); }
  .card .meta + .meta { margin-top:4px; }
</style>
</head>
<body>
<canvas id="ambient-canvas" aria-hidden="true"></canvas>
<main>
  <div class="label">Video integrity · uploads</div>
  <h1>Upload status</h1>
  <div class="sub">Refreshes every second. COMPLETE is shown only after the server verified the full-file SHA-256.
    <a href="/capture">Record in the browser</a></div>
  <div id="list" class="empty">Loading…</div>
</main>
<script src="/static/ambient.js"></script>
<script>
const fmtBytes = b => b >= 1048576 ? (b/1048576).toFixed(2)+' MB' : b >= 1024 ? (b/1024).toFixed(1)+' KB' : b+' B';
const fmtTime = t => t ? new Date(t*1000).toLocaleTimeString() : '–';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const open = new Set();

async function refresh() {
  try {
    const ups = await (await fetch('/uploads')).json();
    if (!ups.length) { document.getElementById('list').innerHTML = '<div class="empty">No uploads yet.</div>'; return; }
    const parts = await Promise.all(ups.map(async u => {
      let ev = '';
      if (open.has(u.upload_id)) {
        const events = await (await fetch(`/uploads/${u.upload_id}/events`)).json();
        ev = '<table>' + events.map(e => `<tr><td>${fmtTime(e.ts)}</td><td>${esc(e.event)}</td><td>${esc(e.detail)}</td></tr>`).join('') + '</table>';
      }
      return `<div class="card">
        <div class="row"><span class="name">${esc(u.filename)}</span><span class="state ${u.state}">${u.state}</span>
          <span class="meta mono">${fmtBytes(u.received_bytes)} / ${fmtBytes(u.size)} · ${(u.progress*100).toFixed(1)}%</span></div>
        <div class="bar ${u.state}"><div style="width:${u.progress*100}%"></div></div>
        <div class="meta">chunks <code>${u.chunks_received}</code> · duplicates <code>${u.duplicate_chunks}</code> · rejected <code>${u.rejected_chunks}</code>
          · last activity <code>${fmtTime(u.last_activity_at)}</code>${u.detail ? ' · ' + esc(u.detail) : ''}</div>
        <div class="hashes meta"><span class="label">declared SHA-256</span><code>${esc(u.sha256)}</code>
        ${u.server_sha256 ? `<span class="label">server SHA-256</span><code>${esc(u.server_sha256)}</code>` : ''}</div>
        <div class="meta" style="margin-top:10px">integrity analysis: ${u.analysis === 'done'
          ? `<a href="/uploads/${u.upload_id}/report.html" target="_blank">report</a> · <a href="/uploads/${u.upload_id}/report" target="_blank">JSON</a>`
          : esc(u.state === 'COMPLETE' ? u.analysis : 'waits for COMPLETE (verified) upload')}</div>
        <details data-id="${u.upload_id}" ${open.has(u.upload_id) ? 'open' : ''}><summary>events</summary>${ev}</details>
      </div>`;
    }));
    document.getElementById('list').innerHTML = parts.join('');
    document.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => {
      d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id);
    }));
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="empty">Server unreachable – retrying…</div>';
  }
}
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
